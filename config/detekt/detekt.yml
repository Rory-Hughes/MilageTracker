config:
  validation: true

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
  TooManyFunctions:
    excludes:
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/data/local/MileageDatabase.kt'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    active: false
